services:
  # --- Backend API (Docker, built from backend/Dockerfile) ---
  # Note: the live service was provisioned as "moededai-2" (https://moededai-2.onrender.com),
  # not the "moded-ai-backend" name below - this blueprint predates that deploy and was never
  # re-synced. Renaming the key here will not rename the live service; it's left as documentation
  # of the blueprint's origin.
  - type: web
    name: moded-ai-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      # Set this in the Render dashboard after import — your real MongoDB Atlas URI.
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      # Set this in the Render dashboard after import.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # The deployed frontend is on Vercel, not Render (see the note at the bottom of this
      # file) - this must be set to that origin in the Render dashboard directly, since
      # Render blueprint sync won't touch an existing service's env vars here.
      - key: CORS_ORIGIN
        value: https://moededai.vercel.app
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: UPLOAD_DIR
        value: uploads
      - key: LOG_LEVEL
        value: info
      - key: EMAIL_PROVIDER
        value: console
      # Optional: set both to bootstrap the first admin via `npm run seed` (run manually
      # from a Render shell once — this is not run automatically on boot).
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: ADMIN_SEED_NAME
        value: Platform Admin

# The frontend is deployed on Vercel (https://moededai.vercel.app), not Render - the static-site
# service block that used to live here was never actually used and has been removed. See
# frontend/vercel.json for the SPA rewrite config, and set VITE_API_BASE_URL in the Vercel
# project's environment variables (Settings -> Environment Variables), not here.
